<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Claude Proxy</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body class="bg-base-100 min-h-screen" x-data="app()">
  <div class="navbar bg-base-200">
    <div class="flex-1">
      <a class="btn btn-ghost text-xl">🛸 Antigravity</a>
    </div>
    <div class="flex-none">
      <ul class="menu menu-horizontal px-1">
        <li><a @click="setTab('dashboard')" :class="tab==='dashboard' && 'active'">Dashboard</a></li>
        <li><a @click="setTab('accounts')" :class="tab==='accounts' && 'active'">Accounts</a></li>
        <li><a @click="setTab('models')" :class="tab==='models' && 'active'">Models</a></li>
        <li><a @click="setTab('logs')" :class="tab==='logs' && 'active'">Logs</a></li>
        <li><a @click="setTab('settings')" :class="tab==='settings' && 'active'">Settings</a></li>
      </ul>
    </div>
  </div>
  <main class="container mx-auto">
    <div x-show="tab==='dashboard'" x-html="await (await fetch('/views/dashboard.html')).text()"></div>
    <div x-show="tab==='accounts'" x-html="await (await fetch('/views/accounts.html')).text()"></div>
    <div x-show="tab==='models'" x-html="await (await fetch('/views/models.html')).text()"></div>
    <div x-show="tab==='logs'" x-html="await (await fetch('/views/logs.html')).text()"></div>
    <div x-show="tab==='settings'" x-html="await (await fetch('/views/settings.html')).text()"></div>
  </main>
</body>
</html>
