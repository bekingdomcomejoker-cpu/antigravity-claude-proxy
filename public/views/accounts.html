<div x-data="accountManager()" x-init="init()" class="p-4">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">Accounts</h2>
    <button class="btn btn-primary btn-sm" @click="$dispatch('open-add-account')">Add Account</button>
  </div>
  <div class="overflow-x-auto">
    <table class="table table-zebra w-full">
      <thead><tr><th>Email</th><th>Status</th><th>Quota</th><th>Actions</th></tr></thead>
      <tbody>
        <template x-for="a in accounts" :key="a.email">
          <tr>
            <td x-text="a.email"></td>
            <td>
              <span class="badge" :class="a.isInvalid ? 'badge-error' : (a.enabled ? 'badge-success' : 'badge-ghost')"
                    x-text="a.isInvalid ? 'Invalid' : (a.enabled ? 'Active' : 'Disabled')"></span>
            </td>
            <td x-text="a.quota ? JSON.stringify(a.quota).slice(0,40) : '—'"></td>
            <td class="space-x-1">
              <button class="btn btn-xs" @click="verifyAccount(a.email)">Verify</button>
              <button class="btn btn-xs btn-error" @click="removeAccount(a.email)">Remove</button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
