<div x-data="serverConfig()" x-init="load()" class="p-4 space-y-6">
  <h2 class="text-2xl font-bold">Server Settings</h2>
  <div class="form-control">
    <label class="label"><span class="label-text">Account Selection Strategy</span></label>
    <select x-model="config.strategy" class="select select-bordered">
      <option value="hybrid">Hybrid (Smart Distribution)</option>
      <option value="sticky">Sticky (Cache Optimized)</option>
      <option value="round-robin">Round Robin (Load Balanced)</option>
    </select>
  </div>
  <div class="form-control">
    <label class="label cursor-pointer"><span class="label-text">Debug Mode</span>
      <input type="checkbox" class="toggle" x-model="config.debug">
    </label>
  </div>
  <div class="form-control">
    <label class="label cursor-pointer"><span class="label-text">Enable Fallback</span>
      <input type="checkbox" class="toggle" x-model="config.fallback">
    </label>
  </div>
  <button class="btn btn-primary" @click="save()">Save Settings</button>

  <div class="divider"></div>
  <div x-data="claudeConfig()" x-init="load()">
    <h3 class="text-xl font-bold mb-2">Claude CLI Configuration</h3>
    <div class="form-control mb-2">
      <label class="label"><span class="label-text">Mode</span></label>
      <select x-model="mode" class="select select-bordered">
        <option value="proxy">Proxy Mode</option>
        <option value="paid">Paid Mode (Official Anthropic)</option>
      </select>
    </div>
    <button class="btn btn-secondary" @click="apply()">Apply to Claude CLI</button>
  </div>
</div>
