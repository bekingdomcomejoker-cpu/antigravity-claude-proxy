<div x-data="dashboard()" x-init="init()" class="p-4 space-y-4">
  <div class="flex justify-between items-center">
    <h2 class="text-2xl font-bold">Dashboard</h2>
    <select x-model="timeRange" @change="refresh()" class="select select-bordered select-sm">
      <option>1H</option><option>6H</option><option selected>24H</option><option>7D</option><option>All</option>
    </select>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="card bg-base-200 p-4"><div class="text-sm opacity-70">Requests</div><div class="text-3xl font-bold" x-text="stats.total || 0"></div></div>
    <div class="card bg-base-200 p-4"><div class="text-sm opacity-70">Active Accounts</div><div class="text-3xl font-bold" x-text="stats.accounts || 0"></div></div>
    <div class="card bg-base-200 p-4"><div class="text-sm opacity-70">Models</div><div class="text-3xl font-bold" x-text="Object.keys(stats.byModel || {}).length"></div></div>
  </div>
  <div class="card bg-base-200 p-4">
    <h3 class="font-semibold mb-2">By Model</h3>
    <template x-for="(count, model) in (stats.byModel || {})" :key="model">
      <div class="flex justify-between py-1"><span x-text="model"></span><span x-text="count"></span></div>
    </template>
  </div>
</div>
