<div x-data="modelsPanel()" x-init="refresh()" class="p-4">
  <h2 class="text-2xl font-bold mb-4">Available Models</h2>
  <div class="grid gap-2">
    <template x-for="m in models" :key="m.id">
      <div class="card bg-base-200 p-3 flex justify-between items-center">
        <span class="font-mono" x-text="m.id"></span>
        <span class="badge badge-outline" x-text="m.id.includes('claude') ? 'Claude' : 'Gemini'"></span>
      </div>
    </template>
  </div>
</div>
